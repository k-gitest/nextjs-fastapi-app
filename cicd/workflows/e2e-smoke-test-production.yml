name: Smoke Tests (Production)

# 現在は手動実行と定期監視のみ
on:
  workflow_dispatch:  # 手動実行
  schedule:
    - cron: '0 */6 * * *'  # 6時間ごとの監視（将来用）
  # workflow_run:
  #   workflows: ["Web CI/CD (Production)", "API CI/CD (Production)"]
  #   types: [completed]
  #   branches: [main]

# 同一 environment での並行実行を防ぐ
# production は cancel-in-progress: false（進行中の監視を途中キャンセルしない）
concurrency:
  group: production-smoke-tests
  cancel-in-progress: false

jobs:
  smoke-tests:
    name: Smoke Tests (Production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          working-directory: apps/web

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> $GITHUB_OUTPUT
        working-directory: apps/web

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: apps/web

      - name: Wait for services
        run: |
          echo "Waiting for web to be ready..."
          timeout 180 bash -c 'until curl -f -s "${{ vars.WEB_URL }}" > /dev/null; do sleep 5; done' || {
            echo "❌ Web not responding after 3 minutes"
            exit 1
          }

          echo "Waiting for API health check..."
          timeout 180 bash -c 'until curl -f -s "${{ vars.FASTAPI_PUBLIC_URL }}/health" > /dev/null 2>&1; do sleep 5; done' || {
            echo "⚠️  API health check not responding (may not be implemented yet)"
            echo "Continuing without health check..."
          }

          echo "✅ Services are ready"

      - name: Run smoke tests
        run: npx playwright test --grep "@smoke" --project=chromium
        working-directory: apps/web
        env:
          BASE_URL: ${{ vars.WEB_URL }}
          FASTAPI_PUBLIC_URL: ${{ vars.FASTAPI_PUBLIC_URL }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          # check-outbox.ts と同じ prefix を使い、Playwright が生成した Todo を特定できるようにする
          SMOKE_PREFIX: "smoke-${{ github.run_id }}-"

      # check-outbox.ts 実行前に apps/worker の依存関係をインストールする
      # setup-node は apps/web 専用のため、worker の node_modules は別途必要
      - name: Install worker dependencies
        run: npm ci
        working-directory: apps/worker

      # Playwright 完了後に Outbox チェーンの最終整合性を確認する
      # production は POLLING_TIMEOUT_MS を 90 秒・STALE_PROCESSING_MS を 120 秒に延長する
      # 理由: production は QStash → FastAPI → BackgroundTasks の遅延が staging より大きい可能性があるため
      # 確認内容:
      #   - payload.title に SMOKE_PREFIX を含むイベント（今回の smoke が生成したもの）のみ対象
      #   - outbox_events が全て sent（failed/pending/retrying/stale processing が残っていないか）
      #   - processed_events に対応するレコードが存在するか（FastAPI到達確認）
      # スクリプト詳細: apps/worker/scripts/check-outbox.ts
      - name: Check Outbox chain integrity
        run: npx tsx scripts/check-outbox.ts
        working-directory: apps/worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMOKE_PREFIX: "smoke-${{ github.run_id }}-"
          POLLING_TIMEOUT_MS: "90000"
          # production は cold start 等を考慮して stale 判定を 2 分に緩める
          STALE_PROCESSING_MS: "120000"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results-production
          path: apps/web/test-results/
          retention-days: 30

      - name: Create summary
        if: always()
        run: |
          echo "## 🔥 Smoke Tests (Production)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** \`production\`" >> $GITHUB_STEP_SUMMARY
          echo "**Web:** ${{ vars.WEB_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**API:** ${{ vars.FASTAPI_PUBLIC_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Smoke tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ URGENT: Production smoke tests failed!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify on failure
        if: failure() && github.event_name == 'schedule'
        run: |
          echo "::error::Production smoke tests failed during scheduled run!"
          echo "This indicates a potential issue with the production environment."