name: API CI (Staging)

on:
  push:
    branches: [staging]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-staging.yml'
      - '.github/workflows/reusable-api-test.yml'
  pull_request:
    branches: [staging]
    paths:
      - 'apps/api/**'
  repository_dispatch:
    types: [deploy-api]

jobs:
  test:
    name: Test (Staging)
    # dispatch時はテストをスキップ（既にCI通過済みのコードをdeployするため）
    if: github.event_name != 'repository_dispatch'
    uses: ./.github/workflows/reusable-api-test.yml
    with:
      environment: staging
      strict-mode: false
      coverage-threshold: 60
    secrets: inherit

  # Terraform Apply からの repository_dispatch でのみ起動するdeploy job
  deploy-from-terraform:
    name: Deploy to Render (API) [Terraform Dispatch]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'repository_dispatch' &&
      github.event.action == 'deploy-api' &&
      github.event.client_payload.environment == 'staging'

    environment:
      name: staging
      url: ${{ vars.FASTAPI_PUBLIC_URL }}

    steps:
      - name: Trigger Render deploy
        run: |
          curl --fail --show-error --silent \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/${{ vars.RENDER_API_SERVICE_ID }}/deploys"

      - name: Create summary
        run: |
          echo "## 🚀 API Deployment (Staging)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** \`staging\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** Terraform Apply" >> $GITHUB_STEP_SUMMARY
          echo "**Strategy:** ${{ github.event.client_payload.deployment_strategy }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status" >> $GITHUB_STEP_SUMMARY
          echo "🔄 Render is deploying" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**API URL:** ${{ vars.FASTAPI_PUBLIC_URL }}" >> $GITHUB_STEP_SUMMARY