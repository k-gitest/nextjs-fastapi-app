name: API CI/CD (Staging)

on:
  push:
    branches: [develop]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-staging.yml'
      - '.github/workflows/reusable-api-test.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'apps/api/**'

jobs:
  test:
    name: Test (Staging)
    uses: ./.github/workflows/reusable-api-test.yml
    with:
      environment: staging
      strict-mode: false
      coverage-threshold: 60
    secrets: inherit

  deploy:
    name: Deploy to Render (API)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Trigger Render deploy
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/${{ vars.RENDER_API_SERVICE_ID }}/deploys"

  deploy-notification:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [test, deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    environment:
      name: staging
      url: ${{ vars.FASTAPI_PUBLIC_URL }}

    steps:
      - name: Create summary
        run: |
          echo "## 🚀 API Deployment (Staging)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** \`staging\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`develop\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tests passed (60%+ coverage)" >> $GITHUB_STEP_SUMMARY
          echo "🔄 Render is deploying" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**API URL:** ${{ vars.FASTAPI_PUBLIC_URL }}" >> $GITHUB_STEP_SUMMARY