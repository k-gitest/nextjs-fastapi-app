name: API CI (Staging)

on:
  push:
    branches: [staging]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-staging.yml'
      - '.github/workflows/reusable-api-test.yml'
      - '.github/actions/setup-python/**'
      - '.github/actions/setup-node/**'
  pull_request:
    branches: [staging]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-staging.yml'
      - '.github/workflows/reusable-api-test.yml'
      - '.github/actions/setup-python/**'
      - '.github/actions/setup-node/**'

jobs:
  test:
    name: Test (Staging)
    uses: ./.github/workflows/reusable-api-test.yml
    with:
      environment: staging
      strict-mode: false
      coverage-threshold: 60
    secrets: inherit
