name: Web CI (Production)

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/db/**'
      - '.github/workflows/web-production.yml'
      - '.github/workflows/reusable-web-test.yml'
      - '.github/actions/setup-node/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/db/**'
      - '.github/workflows/web-production.yml'
      - '.github/workflows/reusable-web-test.yml'
      - '.github/actions/setup-node/**'
  repository_dispatch:
    types: [deploy-web]

jobs:
  test:
    name: Test (Production)
    if: github.event_name != 'repository_dispatch'
    uses: ./.github/workflows/reusable-web-test.yml
    with:
      environment: production
      strict-mode: true
      coverage-threshold: 80
    secrets: inherit

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'

    environment: production

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
      AUTH0_SECRET: ${{ secrets.AUTH0_SECRET }}
      AUTH0_BASE_URL: http://localhost:3000
      AUTH0_ISSUER_BASE_URL: ${{ secrets.AUTH0_ISSUER_BASE_URL }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
      INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      APP_BASE_URL: http://localhost:3000
      DOMAIN_URL: http://localhost:3000
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          working-directory: apps/web

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/db

      - name: Run DB migrations
        run: npx prisma migrate deploy
        working-directory: packages/db

      # E2E は、このジョブでビルドした成果物を、playwright.config.mts の webServer が
      # npm run start（next start）で起動して実行する（ローカルは npm run dev）
      - name: Build Next.js
        run: npm run build
        working-directory: apps/web

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> $GITHUB_OUTPUT
        working-directory: apps/web

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: apps/web

      - name: Run E2E tests (Chromium only)
        # 新規登録・アカウント削除は行わない（Auth0レート制限リスク）
        run: npx playwright test --project=chromium
        working-directory: apps/web

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-web-production
          path: |
            apps/web/playwright-results/test-results/
            apps/web/playwright-results/playwright-report/
          retention-days: 30

  # Terraform Apply からの repository_dispatch でのみ起動するdeploy job
  deploy-from-terraform:
    name: Deploy to Render (Web) [Terraform Dispatch]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event_name == 'repository_dispatch' &&
      github.event.action == 'deploy-web' &&
      github.event.client_payload.environment == 'production'

    environment:
      name: production
      url: ${{ vars.WEB_URL }}

    steps:
      - name: Trigger Render deploy
        run: |
          curl --fail --show-error --silent \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/${{ vars.RENDER_WEB_SERVICE_ID }}/deploys"

      - name: Create summary
        run: |
          echo "## 🚀 Web Deployment (Production)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** \`production\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** Terraform Apply" >> $GITHUB_STEP_SUMMARY
          echo "**Strategy:** ${{ github.event.client_payload.deployment_strategy }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status" >> $GITHUB_STEP_SUMMARY
          echo "🔄 Render is deploying" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Web URL:** ${{ vars.WEB_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**API URL:** ${{ github.event.client_payload.api_url }}" >> $GITHUB_STEP_SUMMARY