name: Terraform Plan (Manual)

# 手動実行の plan。結果は Terraform Apply workflow の `plan-workflow-run-id` に、
# この workflow の GitHub Actions run ID を渡して適用する。
# （PR 用の plan は terraform-plan.yml）
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

# 同じ環境の plan の並列実行を防ぐ
concurrency:
  group: terraform-plan-manual-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_ORG: nextjs-fastapi-app

jobs:
  plan:
    name: Plan (${{ inputs.environment }})
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ~1.14.0
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: terraform/envs/${{ inputs.environment }}

      - name: Terraform Plan
        id: plan
        env:
          TF_ENV: ${{ inputs.environment }}
        run: |
          set -uo pipefail
          # -detailed-exitcode: 0=変更なし, 1=エラー, 2=変更あり
          set +e
          terraform plan -no-color -detailed-exitcode -out=tfplan
          PLAN_EXIT=$?
          set -e

          if [ "$PLAN_EXIT" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          elif [ "$PLAN_EXIT" -eq 2 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "terraform plan failed (exit code: $PLAN_EXIT)"
            exit 1
          fi

          terraform show -no-color tfplan > plan.txt

          # tfplan は HCP Terraform の run への参照（remote_plan_format）。
          # run_id を取り出して、metadata に記録する（GitHub Actions の run ID とは別物）
          HCP_RUN_ID="$(jq -r '.run_id // empty' tfplan 2>/dev/null || true)"
          if [ "$PLAN_EXIT" -eq 2 ] && [ -z "$HCP_RUN_ID" ]; then
            echo "::error::Could not read run_id from tfplan (unexpected format)"
            exit 1
          fi
          echo "hcp_run_id=${HCP_RUN_ID}" >> "$GITHUB_OUTPUT"
        working-directory: terraform/envs/${{ inputs.environment }}

      - name: Verify HCP run and workspace
        id: hcp
        if: steps.plan.outputs.hcp_run_id != ''
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
        run: |
          bash .github/scripts/hcp-verify-run-workspace.sh \
            "$TF_ORG" "nextjs-fastapi-${{ inputs.environment }}" "${{ steps.plan.outputs.hcp_run_id }}"

      - name: Create metadata
        env:
          TF_ENV: ${{ inputs.environment }}
          HAS_CHANGES: ${{ steps.plan.outputs.has_changes }}
          HCP_RUN_ID: ${{ steps.plan.outputs.hcp_run_id }}
          HCP_WORKSPACE_ID: ${{ steps.hcp.outputs.workspace_id }}
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp "terraform/envs/${TF_ENV}/tfplan" artifact/tfplan
          cp "terraform/envs/${TF_ENV}/plan.txt" artifact/plan.txt

          jq -n \
            --arg environment "$TF_ENV" \
            --arg workspace_name "nextjs-fastapi-${TF_ENV}" \
            --arg workspace_id "$HCP_WORKSPACE_ID" \
            --arg hcp_run_id "$HCP_RUN_ID" \
            --arg commit "$GITHUB_SHA" \
            --arg has_changes "$HAS_CHANGES" \
            --arg plan_workflow_run_id "$GITHUB_RUN_ID" \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{environment:$environment, workspace_name:$workspace_name, workspace_id:$workspace_id,
              hcp_run_id:$hcp_run_id, commit:$commit, has_changes:($has_changes=="true"),
              plan_workflow_run_id:$plan_workflow_run_id, created_at:$created_at}' \
            > artifact/metadata.json
          cat artifact/metadata.json

      - name: Upload plan artifact
        uses: actions/upload-artifact@v6
        with:
          name: tfplan-${{ inputs.environment }}
          path: artifact/
          retention-days: 3
          if-no-files-found: error

      - name: Show Plan Summary
        env:
          HAS_CHANGES: ${{ steps.plan.outputs.has_changes }}
          HCP_RUN_ID: ${{ steps.plan.outputs.hcp_run_id }}
        run: |
          {
            echo "## Terraform Plan (${{ inputs.environment }})"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Has changes | \`${HAS_CHANGES}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| HCP workspace | \`nextjs-fastapi-${{ inputs.environment }}\` |"
            echo "| HCP Terraform run ID | \`${HCP_RUN_ID:-n/a}\` |"
            echo "| **GitHub Actions run ID (\`plan-workflow-run-id\`)** | \`${GITHUB_RUN_ID}\` |"
            echo "| Artifact | \`tfplan-${{ inputs.environment }}\` (retention: 3 days) |"
            echo ""
            echo "Apply: run **Terraform Apply** from the same branch/commit with \`plan-workflow-run-id=${GITHUB_RUN_ID}\`."
            echo ""
            echo "### Changes to be applied:"
            echo '```terraform'
            head -n 100 artifact/plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"