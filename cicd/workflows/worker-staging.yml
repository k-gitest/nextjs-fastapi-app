name: Worker CI (Staging)

on:
  push:
    branches: [staging]
    paths:
      - 'apps/worker/**'
      - 'packages/db/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/worker-staging.yml'
      - '.github/workflows/reusable-worker-test.yml'
      - '.github/actions/setup-node/**'
  pull_request:
    branches: [staging]
    paths:
      - 'apps/worker/**'
      - 'packages/db/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/worker-staging.yml'
      - '.github/workflows/reusable-worker-test.yml'
      - '.github/actions/setup-node/**'

jobs:
  test:
    name: Test (Staging)
    uses: ./.github/workflows/reusable-worker-test.yml
    with:
      environment: staging
    secrets: inherit
