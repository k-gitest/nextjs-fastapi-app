name: Worker CI (Staging)

on:
  push:
    branches: [staging]
    paths:
      - 'apps/worker/**'
      - 'packages/db/**'
      - '.github/workflows/worker-staging.yml'
      - '.github/workflows/reusable-worker-test.yml'
  pull_request:
    branches: [staging]
    paths:
      - 'apps/worker/**'
      - 'packages/db/**'
  repository_dispatch:
    types: [deploy-worker]

jobs:
  test:
    name: Test (Staging)
    # dispatch時はテストをスキップ（既にCI通過済みのコードをdeployするため）
    if: github.event_name != 'repository_dispatch'
    uses: ./.github/workflows/reusable-worker-test.yml
    with:
      environment: staging
    secrets: inherit

  # Terraform Apply からの repository_dispatch でのみ起動するdeploy job
  deploy-from-terraform:
    name: Deploy to Render (Worker) [Terraform Dispatch]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'repository_dispatch' &&
      github.event.action == 'deploy-worker' &&
      github.event.client_payload.environment == 'staging'

    environment:
      name: staging

    steps:
      - name: Trigger Render deploy
        run: |
          curl --fail --show-error --silent \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/${{ vars.RENDER_WORKER_SERVICE_ID }}/deploys"

      - name: Create summary
        run: |
          echo "## 🚀 Worker Deployment (Staging)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** \`staging\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** Terraform Apply" >> $GITHUB_STEP_SUMMARY
          echo "**Strategy:** ${{ github.event.client_payload.deployment_strategy }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status" >> $GITHUB_STEP_SUMMARY
          echo "🔄 Render is deploying" >> $GITHUB_STEP_SUMMARY　