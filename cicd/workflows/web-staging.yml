name: Web CI (Staging)

on:
  push:
    branches: [staging]
    paths:
      - "apps/web/**"
      - "packages/db/**"
      - ".github/workflows/web-staging.yml"
      - ".github/workflows/reusable-web-test.yml"
      - ".github/actions/setup-node/**"
  pull_request:
    branches: [staging]
    paths:
      - "apps/web/**"
      - "packages/db/**"
      - ".github/workflows/web-staging.yml"
      - ".github/workflows/reusable-web-test.yml"
      - ".github/actions/setup-node/**"

jobs:
  test:
    name: Test (Staging)
    uses: ./.github/workflows/reusable-web-test.yml
    with:
      environment: staging
      strict-mode: false
      coverage-threshold: 60
    secrets: inherit

  e2e:
    name: E2E Tests
    runs-on: ubuntu-26.04
    needs: test
    if: github.event_name == 'pull_request'

    environment: staging

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
      AUTH0_SECRET: ${{ secrets.AUTH0_SECRET }}
      AUTH0_BASE_URL: http://localhost:3000
      AUTH0_ISSUER_BASE_URL: ${{ secrets.AUTH0_ISSUER_BASE_URL }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
      INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      # E2EはlocalhostでAuth0 callbackを受ける
      APP_BASE_URL: http://localhost:3000
      DOMAIN_URL: http://localhost:3000
      # E2E用固定テストアカウント（新規登録・削除はしない）
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          working-directory: apps/web

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/db

      - name: Run DB migrations
        run: npx prisma migrate deploy
        working-directory: packages/db

      # E2E は、このジョブでビルドした成果物を、playwright.config.mts の webServer が
      # npm run start（next start）で起動して実行する（ローカルは npm run dev）
      - name: Build Next.js
        run: npm run build
        working-directory: apps/web

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> $GITHUB_OUTPUT
        working-directory: apps/web

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: apps/web

      - name: Run E2E setup (login)
        # ログイン操作は HTML レポートに入力値が出るため、list レポーターで実行し、レポートに残さない
        run: npx playwright test --project=setup --reporter=list --trace off
        working-directory: apps/web

      - name: Run E2E tests (Chromium only)
        # setup は上のステップで実行済みのため --no-deps で外す
        run: npx playwright test --project=chromium --project=auth_chromium --project=guest_chromium --no-deps
        working-directory: apps/web

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-web-staging
          path: |
            apps/web/playwright-results/test-results/
            !apps/web/playwright-results/test-results/setup-auth.setup.ts-authenticate-setup*/
            apps/web/playwright-results/playwright-report/
          retention-days: 7
