name: PR Quality Check

on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  commit-message:
    name: Check Commit Messages
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Validate commit messages
        run: |
          echo "Checking commit messages format..."
          
          # Get all commits in this PR
          COMMITS=$(git log --format=%s origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }})
          
          # Check each commit
          echo "$COMMITS" | while read -r message; do
            # マージコミットはスキップ
            if echo "$message" | grep -qE '^Merge (pull request|branch)'; then
              echo "⏭️  Skipping merge commit: $message"
              continue
            fi

            if ! echo "$message" | grep -qE '^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\(.+\))?: .+'; then
              echo "❌ Invalid commit message: $message"
              echo ""
              echo "Commit messages must follow Conventional Commits format:"
              echo "  type(scope?): subject"
              echo ""
              echo "Types: feat, fix, docs, style, refactor, test, chore, perf, ci, build, revert"
              echo "Example: feat(auth): add login functionality"
              exit 1
            fi
          done
          
          echo "✅ All commit messages are valid"

  file-size:
    name: Check File Sizes
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Check for large files
        run: |
          echo "Checking for files larger than 5MB..."
          
          LARGE_FILES=$(find . -type f -size +5M \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            -not -path "./.venv/*" \
            -not -path "./apps/api/.venv/*" \
            -not -path "./.terraform/*")
          
          if [ -n "$LARGE_FILES" ]; then
            echo "❌ Large files detected (>5MB):"
            echo "$LARGE_FILES"
            echo ""
            echo "Please use Git LFS for large files or remove them."
            exit 1
          fi
          
          echo "✅ No large files detected"

  secret-scan:
    name: Scan for Secrets
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      # gitleaks_8.30.1_linux_x64.tar.gz の SHA256（バージョン更新時は必ず併せて更新する）
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # PR内の全コミット（追加後に削除されたものを含む）を検査するため全履歴を取得する
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$ARCHIVE" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version

      - name: Scan PR commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "Scanning commits ${BASE_SHA}..${HEAD_SHA}"

          # 範囲を誤って狭めないよう、両SHAが取得できていなければエラー終了する
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

          # 検出時は終了コード1で失敗する。--redact でログに秘密情報を出さない
          "$RUNNER_TEMP/gitleaks/gitleaks" git \
            --redact \
            --verbose \
            --no-banner \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            .

          echo "✅ No potential secrets detected"

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-26.04
    needs: [commit-message, file-size, secret-scan]
    if: always()
    
    steps:
      - name: Create PR Summary
        run: |
          echo "## 📋 PR Quality Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.commit-message.result }}" == "success" ]; then
            echo "- ✅ Commit messages follow Conventional Commits" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Commit messages validation failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.file-size.result }}" == "success" ]; then
            echo "- ✅ No large files detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Large files detected" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.secret-scan.result }}" == "success" ]; then
            echo "- ✅ No secrets detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⚠️  Potential secrets detected - please review" >> $GITHUB_STEP_SUMMARY
          fi