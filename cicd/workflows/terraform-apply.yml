name: Terraform Apply

# Terraform Plan (Manual) で作成・確認済みの plan を適用する。
# plan は再作成しない。`plan-workflow-run-id` には、Plan (Manual) の GitHub Actions run ID を指定する。
# （HCP Terraform の run ID ではない）
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        required: true
        type: choice
        options:
          - staging
          - production
      plan-workflow-run-id:
        description: GitHub Actions run ID of "Terraform Plan (Manual)" (not the HCP Terraform run ID)
        required: true
        type: string
      trigger-deployment:
        description: Trigger application deployment after apply
        required: false
        type: boolean
        default: true
      deployment-strategy:
        description: Deployment strategy
        required: false
        type: choice
        options:
          - auto       # 環境に応じて自動選択
          - parallel   # 並列実行（高速）
          - sequential # 順次実行（安全）
        default: auto

permissions:
  contents: read
  actions: read # 別 run のアーティファクト取得・run 情報の参照に必要

# 並列実行を防ぐ
concurrency:
  group: terraform-apply-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_ORG: nextjs-fastapi-app
  PLAN_WORKFLOW_PATH: .github/workflows/terraform-plan-manual.yml

jobs:
  apply:
    name: Apply (${{ inputs.environment }})
    runs-on: ubuntu-26.04
    outputs:
      apply-success: ${{ steps.apply.outputs.success }}
      deployment-strategy: ${{ steps.strategy.outputs.strategy }}
      api-url: ${{ steps.env_urls.outputs.api_url }}
      web-url: ${{ steps.env_urls.outputs.web_url }}

    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Determine Deployment Strategy
        id: strategy
        run: |
          STRATEGY="${{ inputs.deployment-strategy }}"

          # auto の場合は環境に応じて決定
          if [ "$STRATEGY" == "auto" ]; then
            if [ "${{ inputs.environment }}" == "production" ]; then
              STRATEGY="sequential"
              echo "🔴 Production: Using sequential deployment (safe)"
            else
              STRATEGY="parallel"
              echo "🔵 Staging: Using parallel deployment (fast)"
            fi
          fi

          echo "strategy=$STRATEGY" >> $GITHUB_OUTPUT

          # デプロイを起動する場合のみ、Summary に戦略を表示する
          if [ "${{ inputs.trigger-deployment }}" == "true" ]; then
            echo "## 🚀 Deployment Strategy" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Selected:** \`$STRATEGY\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [ "$STRATEGY" == "parallel" ]; then
              echo "### ⚡ Parallel Deployment" >> $GITHUB_STEP_SUMMARY
              echo "- Web / API / Worker deploy simultaneously" >> $GITHUB_STEP_SUMMARY
              echo "- ✅ Faster (saves 2-3 minutes)" >> $GITHUB_STEP_SUMMARY
              echo "- ⚠️ Web may be ready before API" >> $GITHUB_STEP_SUMMARY
            else
              echo "### ⚡ Sequential Deployment" >> $GITHUB_STEP_SUMMARY
              echo "- API → Worker → Web の順にデプロイ要求を送る（この workflow 経由の順序のみ制御。自動デプロイは迂回するため、全体の順序は保証しない）" >> $GITHUB_STEP_SUMMARY
              echo "- 💡 API は /health/ready（DB 接続と processed_events へのクエリ）のみ確認。新版の起動・migration 完了・無停止は保証しない" >> $GITHUB_STEP_SUMMARY
              echo "- ⏳ Takes longer (waits for API readiness check)" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      # ━━━ plan の取得と整合性確認（terraform apply より前。失敗したら適用しない） ━━━

      - name: Verify plan workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan-workflow-run-id }}
        run: |
          set -euo pipefail
          if ! [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::plan-workflow-run-id must be a numeric GitHub Actions run ID"
            exit 1
          fi

          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PLAN_RUN_ID}")"
          RUN_PATH="$(jq -r '.path // empty' <<<"$RUN_JSON")"
          RUN_PATH="${RUN_PATH%%@*}"
          RUN_CONCLUSION="$(jq -r '.conclusion // empty' <<<"$RUN_JSON")"
          RUN_SHA="$(jq -r '.head_sha // empty' <<<"$RUN_JSON")"

          echo "Plan run: ${PLAN_RUN_ID} (workflow: ${RUN_PATH}, conclusion: ${RUN_CONCLUSION}, commit: ${RUN_SHA})"

          # 1) 指定された run が、Plan (Manual) workflow のものか
          if [ "$RUN_PATH" != "$PLAN_WORKFLOW_PATH" ]; then
            echo "::error::Run ${PLAN_RUN_ID} is not a run of ${PLAN_WORKFLOW_PATH}"
            exit 1
          fi
          # 2) 成功した run か
          if [ "$RUN_CONCLUSION" != "success" ]; then
            echo "::error::Plan run ${PLAN_RUN_ID} did not succeed (conclusion: ${RUN_CONCLUSION})"
            exit 1
          fi
          # 3) plan 時と apply 時のコミットが同じか（同じブランチ・コミットから実行する）
          if [ "$RUN_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Commit mismatch: plan=${RUN_SHA}, apply=${GITHUB_SHA}. Run apply from the same commit as the plan."
            exit 1
          fi

      - name: Download plan artifact
        uses: actions/download-artifact@v7
        with:
          name: tfplan-${{ inputs.environment }}
          run-id: ${{ inputs.plan-workflow-run-id }}
          github-token: ${{ github.token }}
          path: plan-artifact

      - name: Verify plan metadata
        id: meta
        env:
          TF_ENV: ${{ inputs.environment }}
          PLAN_RUN_ID: ${{ inputs.plan-workflow-run-id }}
        run: |
          set -euo pipefail
          META=plan-artifact/metadata.json

          META_ENV="$(jq -r '.environment' "$META")"
          META_COMMIT="$(jq -r '.commit' "$META")"
          META_HAS_CHANGES="$(jq -r '.has_changes' "$META")"
          META_HCP_RUN_ID="$(jq -r '.hcp_run_id // empty' "$META")"
          META_WS_NAME="$(jq -r '.workspace_name' "$META")"
          META_WS_ID="$(jq -r '.workspace_id // empty' "$META")"
          META_PLAN_RUN_ID="$(jq -r '.plan_workflow_run_id // empty' "$META")"

          # GitHub Actions の run ID の一致（入力 plan-workflow-run-id と、記録した値）
          if [ "$META_PLAN_RUN_ID" != "$PLAN_RUN_ID" ]; then
            echo "::error::Plan workflow run ID mismatch: metadata=${META_PLAN_RUN_ID:-none}, input=${PLAN_RUN_ID}"
            exit 1
          fi
          # 環境の一致
          if [ "$META_ENV" != "$TF_ENV" ]; then
            echo "::error::Environment mismatch: plan=${META_ENV}, apply=${TF_ENV}"
            exit 1
          fi
          # コミットの一致
          if [ "$META_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::Commit mismatch: plan=${META_COMMIT}, apply=${GITHUB_SHA}"
            exit 1
          fi
          # ワークスペース名が、この環境のものか
          if [ "$META_WS_NAME" != "nextjs-fastapi-${TF_ENV}" ]; then
            echo "::error::Workspace mismatch: plan=${META_WS_NAME}, expected=nextjs-fastapi-${TF_ENV}"
            exit 1
          fi

          if [ "$META_HAS_CHANGES" = "true" ]; then
            # tfplan の HCP run ID と、記録した値の一致
            TFPLAN_RUN_ID="$(jq -r '.run_id // empty' plan-artifact/tfplan)"
            if [ -z "$TFPLAN_RUN_ID" ] || [ "$TFPLAN_RUN_ID" != "$META_HCP_RUN_ID" ]; then
              echo "::error::HCP run ID mismatch: tfplan=${TFPLAN_RUN_ID:-none}, metadata=${META_HCP_RUN_ID:-none}"
              exit 1
            fi

            # 変更ありの場合、plan 時に記録した workspace ID は必須
            if [ -z "$META_WS_ID" ]; then
              echo "::error::workspace_id is missing in metadata.json"
              exit 1
            fi
          fi

          echo "has_changes=${META_HAS_CHANGES}" >> "$GITHUB_OUTPUT"
          echo "hcp_run_id=${META_HCP_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "workspace_name=${META_WS_NAME}" >> "$GITHUB_OUTPUT"
          echo "workspace_id=${META_WS_ID}" >> "$GITHUB_OUTPUT"

      # run が、この環境のワークスペースのものか（run ID の一致だけでは保証されない）
      - name: Verify HCP run and workspace
        id: hcp
        if: steps.meta.outputs.has_changes == 'true'
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
        run: |
          bash .github/scripts/hcp-verify-run-workspace.sh \
            "$TF_ORG" "${{ steps.meta.outputs.workspace_name }}" "${{ steps.meta.outputs.hcp_run_id }}"

      # 現在のワークスペース ID が、plan 時に記録した ID と一致すること（取得できない場合も失敗）
      - name: Verify workspace ID matches plan
        if: steps.meta.outputs.has_changes == 'true'
        env:
          META_WS_ID: ${{ steps.meta.outputs.workspace_id }}
          CUR_WS_ID: ${{ steps.hcp.outputs.workspace_id }}
        run: |
          if [ -z "$META_WS_ID" ] || [ -z "$CUR_WS_ID" ] || [ "$META_WS_ID" != "$CUR_WS_ID" ]; then
            echo "::error::Workspace ID mismatch or unavailable: plan=${META_WS_ID:-none}, current=${CUR_WS_ID:-none}"
            exit 1
          fi
          echo "Workspace ID verified: ${CUR_WS_ID}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ~1.14.0
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      # terraform apply（変更ありの場合）に必要。変更なしの場合は apply を省略するが、init は常に実行する
      - name: Terraform Init
        run: terraform init
        working-directory: terraform/envs/${{ inputs.environment }}

      - name: Show Plan Summary
        env:
          HAS_CHANGES: ${{ steps.meta.outputs.has_changes }}
          HCP_RUN_ID: ${{ steps.meta.outputs.hcp_run_id }}
        run: |
          {
            echo "## Terraform Apply (${{ inputs.environment }})"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Plan workflow run ID (GitHub Actions) | \`${{ inputs.plan-workflow-run-id }}\` |"
            echo "| HCP Terraform run ID | \`${HCP_RUN_ID:-n/a}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Has changes | \`${HAS_CHANGES}\` |"
            echo ""
            echo "### Plan being applied:"
            echo '```terraform'
            head -n 100 plan-artifact/plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Apply
        id: apply
        env:
          HAS_CHANGES: ${{ steps.meta.outputs.has_changes }}
        run: |
          if [ "$HAS_CHANGES" != "true" ]; then
            echo "No changes. Skipping terraform apply."
            echo "applied=false" >> "$GITHUB_OUTPUT"
          else
            cp "$GITHUB_WORKSPACE/plan-artifact/tfplan" tfplan
            terraform apply tfplan
            echo "applied=true" >> "$GITHUB_OUTPUT"
          fi

          # apply が失敗した場合は、ここに到達せず success は設定されない（デプロイ連鎖は起動しない）
          echo "success=true" >> "$GITHUB_OUTPUT"
        working-directory: terraform/envs/${{ inputs.environment }}

      - name: Apply failure guidance
        if: failure() && steps.apply.outcome == 'failure'
        run: |
          {
            echo "## ❌ terraform apply failed"
            echo ""
            echo "デプロイは起動していません。まずログで失敗の原因を確認してください。"
            echo "plan が無効になった（state の変更、plan の破棄など）ことが原因の場合は、"
            echo "Terraform Plan (Manual) を再実行し、新しい run ID で Apply してください。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Get Environment URLs
        id: env_urls
        if: steps.apply.outcome == 'success'
        env:
          TRIGGER_DEPLOYMENT: ${{ inputs.trigger-deployment }}
          WEB_URL: ${{ vars.WEB_URL }}
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ "$TRIGGER_DEPLOYMENT" == "true" ] && { [ -z "$WEB_URL" ] || [ -z "$API_URL" ]; }; then
            echo "::error::vars.WEB_URL / vars.API_URL is empty; refusing to trigger deployment"
            exit 1
          fi
          echo "web_url=${WEB_URL}" >> "$GITHUB_OUTPUT"
          echo "api_url=${API_URL}" >> "$GITHUB_OUTPUT"

      - name: Create Deployment Summary
        if: steps.apply.outcome == 'success'
        run: |
          echo "## 🚀 Terraform Apply Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** \`${{ inputs.environment }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.apply.outputs.applied }}" == "true" ]; then
            echo "**Status:** ✅ Success" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Status:** ✅ Success (No changes — terraform apply skipped)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ inputs.trigger-deployment }}" == "true" ]; then
            echo "### 🔄 Next: Application Deployment" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Deployment strategy: **${{ steps.strategy.outputs.strategy }}**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify on Failure
        if: failure()
        run: |
          echo "## ❌ Terraform Apply Failed" >> $GITHUB_STEP_SUMMARY

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 並列デプロイ（Staging向け）
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  trigger-deployment-parallel:
    name: Trigger ${{ matrix.service }} Deployment
    runs-on: ubuntu-26.04
    permissions:
      contents: write # repository_dispatch の送信に必要（GITHUB_TOKEN を使用）
    needs: apply
    if: |
      needs.apply.outputs.apply-success == 'true' &&
      inputs.trigger-deployment &&
      needs.apply.outputs.deployment-strategy == 'parallel'

    strategy:
      matrix:
        include:
          - service: Web
            event: deploy-web
          - service: API
            event: deploy-api
          - service: Worker
            event: deploy-worker

    steps:
      - name: Trigger Dispatch
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ github.token }}
          event-type: ${{ matrix.event }}
          client-payload: |
            {
              "environment": "${{ inputs.environment }}",
              "triggered_by": "terraform-apply",
              "run_id": "${{ github.run_id }}",
              "deployment_strategy": "parallel",
              "api_url": "${{ needs.apply.outputs.api-url }}",
              "web_url": "${{ needs.apply.outputs.web-url }}"
            }

      - name: Create Summary
        run: |
          echo "## ⚡ ${{ matrix.service }} Deployment Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Strategy:** Parallel (simultaneous with other services)" >> $GITHUB_STEP_SUMMARY
          echo "**Event:** \`${{ matrix.event }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View workflow](https://github.com/${{ github.repository }}/actions)" >> $GITHUB_STEP_SUMMARY

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 順次デプロイ（Production向け）
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  trigger-api-sequential:
    name: Trigger API Deployment (Sequential)
    runs-on: ubuntu-26.04
    permissions:
      contents: write # repository_dispatch の送信に必要（GITHUB_TOKEN を使用）
    needs: apply
    if: |
      needs.apply.outputs.apply-success == 'true' &&
      inputs.trigger-deployment &&
      needs.apply.outputs.deployment-strategy == 'sequential'

    steps:
      - name: Trigger API Deployment
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ github.token }}
          event-type: deploy-api
          client-payload: |
            {
              "environment": "${{ inputs.environment }}",
              "triggered_by": "terraform-apply",
              "run_id": "${{ github.run_id }}",
              "deployment_strategy": "sequential",
              "api_url": "${{ needs.apply.outputs.api-url }}"
            }

      - name: Wait for API Ready
        run: |
          echo "## 🛡️ Sequential Deployment: API First" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⏳ Waiting for API to become ready before deploying Worker..." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This check confirms DB query readiness only. It does not confirm the new API version, migration completion, or zero downtime." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # API の ready チェック（DB 接続と processed_events へのクエリ実行可否のみ。新版の起動・migration 完了は確認しない）
          MAX_WAIT=300
          ELAPSED=0
          INTERVAL=30

          API_URL="${{ needs.apply.outputs.api-url }}"

          # /health/ready のみで判定する。
          # 失敗時に /health へフォールバックすると、ready の失敗が隠れて通過してしまう。
          HEALTH_PATH="/health/ready"

          echo "Checking API health: $API_URL$HEALTH_PATH"

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            if curl -f -s -o /dev/null "$API_URL$HEALTH_PATH"; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "✅ API is ready! (after ${ELAPSED}s)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Proceeding to Worker deployment..." >> $GITHUB_STEP_SUMMARY
              exit 0
            fi

            echo "⏳ API not ready yet (${ELAPSED}s elapsed)..."
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ API health check timeout (${MAX_WAIT}s)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # production では ready を確認できないまま後続のデプロイへ進めないため fail させる
          # staging では続行を許容
          if [ "${{ inputs.environment }}" == "production" ]; then
            echo "❌ Production deployment aborted: API readiness could not be confirmed." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "Worker deployment will still proceed (staging)." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

  # Web は Worker の後にデプロイ要求を送る（この workflow 内で API → Worker → Web の順に送る）
  trigger-worker-sequential:
    name: Trigger Worker Deployment (Sequential)
    runs-on: ubuntu-26.04
    permissions:
      contents: write # repository_dispatch の送信に必要（GITHUB_TOKEN を使用）
    needs: [apply, trigger-api-sequential]
    if: |
      needs.apply.outputs.apply-success == 'true' &&
      inputs.trigger-deployment &&
      needs.apply.outputs.deployment-strategy == 'sequential'

    steps:
      - name: Trigger Worker Deployment
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ github.token }}
          event-type: deploy-worker
          client-payload: |
            {
              "environment": "${{ inputs.environment }}",
              "triggered_by": "terraform-apply",
              "run_id": "${{ github.run_id }}",
              "deployment_strategy": "sequential",
              "api_url": "${{ needs.apply.outputs.api-url }}"
            }

      - name: Wait for Worker Ready
        run: |
          echo "## 🛡️ Sequential Deployment: Worker Second" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⏳ Waiting for Worker to become ready before deploying Web..." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # TODO: Worker に HTTP health endpoint（/health/worker 等）が実装されたら
          # fixed sleep を readiness check に置き換える
          # Worker は現在 HTTP サーバーを持たないポーリングプロセスのため固定 wait で代替
          WORKER_WAIT=60
          echo "⏳ Waiting ${WORKER_WAIT}s for Worker to stabilize..."
          sleep $WORKER_WAIT

          echo "✅ Worker stabilization wait complete" >> $GITHUB_STEP_SUMMARY
          echo "Proceeding to Web deployment..." >> $GITHUB_STEP_SUMMARY

  # Web は Worker の後にデプロイする（API → Worker → Web の順序を保証）
  trigger-web-sequential:
    name: Trigger Web Deployment (Sequential)
    runs-on: ubuntu-26.04
    permissions:
      contents: write # repository_dispatch の送信に必要（GITHUB_TOKEN を使用）
    needs: [apply, trigger-worker-sequential]
    if: |
      needs.apply.outputs.apply-success == 'true' &&
      inputs.trigger-deployment &&
      needs.apply.outputs.deployment-strategy == 'sequential'

    steps:
      - name: Trigger Web Deployment
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ github.token }}
          event-type: deploy-web
          client-payload: |
            {
              "environment": "${{ inputs.environment }}",
              "triggered_by": "terraform-apply",
              "run_id": "${{ github.run_id }}",
              "deployment_strategy": "sequential",
              "web_url": "${{ needs.apply.outputs.web-url }}",
              "api_url": "${{ needs.apply.outputs.api-url }}"
            }

      - name: Create Summary
        run: |
          echo "## 🚀 Web Deployment Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Strategy:** Sequential (after API → Worker)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deploy order: API ✅ → Worker ✅ → Web 🔄" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View workflow](https://github.com/${{ github.repository }}/actions)" >> $GITHUB_STEP_SUMMARY