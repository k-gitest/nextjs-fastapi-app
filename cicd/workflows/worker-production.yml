name: Worker CI (Production)

on:
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'packages/db/**'
      - '.github/workflows/worker-production.yml'
      - '.github/workflows/reusable-worker-test.yml'
      - '.github/actions/setup-node/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'packages/db/**'
      - '.github/workflows/worker-production.yml'
      - '.github/workflows/reusable-worker-test.yml'
      - '.github/actions/setup-node/**'

jobs:
  test:
    name: Test (Production)
    uses: ./.github/workflows/reusable-worker-test.yml
    with:
      environment: production
    secrets: inherit
